<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — this page wandered off</title>
    <link rel="icon" type="image/svg+xml" href="/PS.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Gochi+Hand&family=Nunito:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --lav: #8b90d6;
        --cream: #fbf8ef;
        --cream-edge: #ece4d2;
        --ink: #3a3d7a;
        --pink: #f5a4c2;
        --yellow: #ffd24d;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-family: 'Nunito', system-ui, sans-serif;
        color: var(--ink);
        background-color: var(--lav);
        background-image:
          radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.18) 0%, transparent 40%),
          radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.12) 0%, transparent 38%);
      }
      .card {
        background: var(--cream);
        border: 1px solid var(--cream-edge);
        border-radius: 18px;
        box-shadow: 0 16px 38px rgba(40, 34, 80, 0.28);
        padding: 48px 40px;
        max-width: 440px;
        position: relative;
        transform: rotate(-1.5deg);
      }
      .tape {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%) rotate(-5deg);
        width: 110px;
        height: 26px;
        background: rgba(245, 164, 194, 0.8);
        background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.25) 0 6px,
          transparent 6px 12px
        );
      }
      .big {
        font-family: 'Caveat', cursive;
        font-size: 7rem;
        line-height: 0.9;
        font-weight: 700;
        color: var(--pink);
      }
      .sub { font-family: 'Gochi Hand', cursive; font-size: 1.6rem; margin: 8px 0 4px; }
      p.lead { font-weight: 700; color: #5c5fa0; margin-bottom: 24px; }
      a.home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'Gochi Hand', cursive;
        font-size: 1.2rem;
        text-decoration: none;
        color: var(--ink);
        background: var(--yellow);
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 12px 24px;
        box-shadow: 3px 4px 0 var(--ink);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      a.home:hover { transform: translate(-1px, -2px); box-shadow: 5px 7px 0 var(--ink); }
      a.home:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
      .star { font-size: 2rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="tape"></span>
      <div class="star">✦</div>
      <div class="big">404</div>
      <div class="sub">this page wandered off 🧭</div>
      <p class="lead">it probably went chasing a sunset. let's get you back home.</p>
      <a class="home" href="/">↜ back to the scrapbook</a>
    </div>
  </body>
</html>
